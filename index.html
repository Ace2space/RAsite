<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radhika, the city has been waiting up for you.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1E1438; --cream: #FFF4D6; --rose: #FF6F91; --lamp: #FFE27A; --ink: #1E1438;
    --plate: #FFFFFF; --plate-ink: #111111; --ind: #2A5DB0;
    color-scheme: dark; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --night: #1E1438; --cream: #FFF4D6; --rose: #FF6F91; --lamp: #FFE27A; --ink: #1E1438; --plate: #FFFFFF; --plate-ink: #111111; --ind: #2A5DB0; }
  }
  :root[data-theme="dark"] { --night: #1E1438; --cream: #FFF4D6; --rose: #FF6F91; --lamp: #FFE27A; --ink: #1E1438; --plate: #FFFFFF; --plate-ink: #111111; --ind: #2A5DB0; }

  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--cream);
    font-family: "Press Start 2P", ui-monospace, "Courier New", monospace;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .ui {
    position: fixed; inset: 0; pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 7vh) 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .ui button { pointer-events: auto; }
  #intro { display: flex; flex-direction: column; align-items: center; }
  .greet { font-size: clamp(10px, 1.4vw, 14px); line-height: 2; margin: 0 0 12px; color: var(--lamp); text-shadow: 2px 2px 0 var(--night); }
  h1 { font-size: clamp(14px, 3.8vw, 20px); line-height: 1.7; font-weight: 400; margin: 0 0 12px; max-width: 20ch; text-shadow: 3px 3px 0 var(--night); }
  .sub { font-size: clamp(11px, 1.6vw, 15px); line-height: 2; margin: 0 0 22px; max-width: 32ch; text-shadow: 2px 2px 0 var(--night); }
  .plate {
    display: inline-flex; align-items: stretch; margin: 0 0 24px;
    background: var(--plate); color: var(--plate-ink);
    border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  }
  .plate .ind { background: var(--ind); color: var(--plate); font-size: 6px; padding: 5px 4px; display: flex; align-items: flex-end; }
  .plate .num { padding: 9px 12px 8px; font-size: clamp(10px, 1.4vw, 14px); letter-spacing: 1px; white-space: nowrap; }

  button {
    font: inherit; font-size: clamp(10px, 1.3vw, 13px); color: var(--ink); background: var(--rose);
    border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 14px 18px; cursor: pointer;
  }
  button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
  button:focus-visible { outline: 3px solid var(--lamp); outline-offset: 4px; }

  .hint { font-size: clamp(8px, 1.1vw, 11px); line-height: 2; margin: 0; max-width: 34ch; text-shadow: 2px 2px 0 var(--night); opacity: 0; transition: opacity .6s; }
  .hint.show { opacity: 1; }
  .end { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 0 20px; }
  .end p { font-size: clamp(8px, 1.1vw, 11px); line-height: 2; margin: 0; max-width: 36ch; color: var(--lamp); text-shadow: 2px 2px 0 var(--night); }

  .bar { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 10px; display: flex; gap: 8px; z-index: 3; }
  .bar button { font-size: 9px; padding: 9px 10px; background: var(--cream); box-shadow: 3px 3px 0 var(--ink); }
  .bar button:active { box-shadow: 0 0 0 var(--ink); transform: translate(3px, 3px); }
  .menu-wrap { position: relative; }
  .menu {
    position: absolute; top: calc(100% + 8px); right: 0; min-width: 180px;
    background: var(--cream); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    padding: 4px; display: flex; flex-direction: column;
  }
  .menu button { border: 0; box-shadow: none; background: transparent; text-align: left; padding: 11px 8px; font-size: 9px; line-height: 1.6; }
  .menu button:active { transform: none; }
  .menu button[aria-pressed="true"] { background: var(--rose); }

  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 64px); transform: translateX(-50%);
    background: var(--lamp); color: var(--ink); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    padding: 10px 12px; font-size: 9px; line-height: 1.8; max-width: 80vw; text-align: center;
    opacity: 0; transition: opacity .4s; pointer-events: none; z-index: 8;
  }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .hint, .toast { transition: none; } }

  :root { --cab: #241B3A; --panel: #2A2140; --panel2: #3A2E55; --screen: #0E1B22; --screen-ink: #B9F18C; --note: #FFE27A; --card: #FFF4D6; --glass: #9FE3FF; --muted: #8A6A90; --key: #1E3440; --ring: #555566; --gold: #FFC94A; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --cab: #241B3A; --panel: #2A2140; --panel2: #3A2E55; --screen: #0E1B22; --screen-ink: #B9F18C; --note: #FFE27A; --card: #FFF4D6; --glass: #9FE3FF; --muted: #8A6A90; --key: #1E3440; --ring: #555566; --gold: #FFC94A; }
  }
  :root[data-theme="dark"] { --cab: #241B3A; --panel: #2A2140; --panel2: #3A2E55; --screen: #0E1B22; --screen-ink: #B9F18C; --note: #FFE27A; --card: #FFF4D6; --glass: #9FE3FF; --muted: #8A6A90; --key: #1E3440; --ring: #555566; --gold: #FFC94A; }

  /* garage lock */
  .modal {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 66px); transform: translateX(-50%); z-index: 4;
    width: min(340px, calc(100vw - 32px)); box-sizing: border-box; padding: 16px; text-align: center;
    background: var(--panel); color: var(--cream); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
  }
  .lk-title { font-size: 10px; color: var(--lamp); margin: 0 0 12px; letter-spacing: 1px; }
  .lk-led { display: inline-block; width: 8px; height: 8px; background: var(--rose); margin-right: 8px; vertical-align: middle; }
  .lk-led.ok { background: var(--screen-ink); }
  .lk-q { font-size: 9px; line-height: 2; margin: 0 0 8px; }
  .lk-hint { font-size: 8px; line-height: 2; margin: 0 0 14px; color: var(--cream); opacity: .7; }
  .modal input {
    font: inherit; font-size: 13px; width: 100%; box-sizing: border-box; padding: 12px; text-align: center; letter-spacing: 3px;
    background: var(--screen); color: var(--screen-ink); border: 3px solid var(--ink); text-transform: uppercase;
    -webkit-user-select: text; user-select: text; touch-action: auto; border-radius: 0; outline: none;
  }
  .modal input:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
  .lk-msg { min-height: 18px; font-size: 8px; line-height: 2; margin: 10px 0; color: var(--lamp); }
  .shake { animation: shake .35s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* dashboard */
  .dash { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; transition: opacity .8s; }
  .dash.fade { opacity: 0; }
  .windshield {
    position: relative; flex: 1 1 auto; border-style: solid; border-color: var(--cab);
    border-width: calc(env(safe-area-inset-top, 0px) + 16px) 22px 0;
  }
  .windshield::before { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--ink); pointer-events: none; }
  .mirror { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 120px; height: 28px; background: var(--panel2); border: 3px solid var(--ink); }
  .mirror::after { content: ""; position: absolute; inset: 4px; background: var(--glass); opacity: .7; }
  .charm { position: absolute; top: 27px; left: 50%; width: 2px; height: 34px; margin-left: -1px; background: var(--cream); transform-origin: top center; animation: swing 2.4s ease-in-out infinite; }
  .charm::after {
    content: ""; position: absolute; bottom: -14px; left: -7px; width: 16px; height: 14px; background: var(--rose);
    clip-path: polygon(0 25%, 25% 0, 50% 25%, 75% 0, 100% 25%, 100% 50%, 50% 100%, 0 50%);
  }
  @keyframes swing { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
  .note {
    position: absolute; left: 14px; bottom: calc(min(62vh, 470px) - 14px); z-index: 1; margin: 0;
    width: 96px; padding: 10px 8px; background: var(--note); color: var(--ink);
    font-size: 7px; line-height: 1.9; transform: rotate(-5deg); box-shadow: 3px 3px 0 var(--ink);
  }
  .panel {
    position: relative; flex: 0 0 auto; height: min(62vh, 470px); box-sizing: border-box; overflow: hidden;
    background: var(--panel); border-top: 6px solid var(--panel2); box-shadow: 0 -3px 0 var(--ink);
    display: flex; flex-direction: column; align-items: center; padding: 18px 10px 0;
  }
  .cluster {
    display: grid; grid-template-columns: minmax(48px, 150px) minmax(196px, 340px) minmax(48px, 150px);
    gap: 10px; align-items: center; justify-content: center; width: 100%; max-width: 660px;
  }
  .g svg { width: 100%; height: auto; display: block; opacity: .55; transition: opacity .4s, filter .4s; }
  .dash.on .g svg { opacity: 1; filter: drop-shadow(0 0 6px var(--lamp)); }
  .g p { font-size: 6px; text-align: center; margin: 6px 0 0; color: var(--cream); line-height: 1.7; }
  .screen {
    position: relative; min-height: 200px; box-sizing: border-box; padding: 14px 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center;
    background: var(--screen); color: var(--screen-ink); border: 4px solid var(--ink); box-shadow: inset 0 0 0 2px var(--key);
  }
  .dash.on .screen { box-shadow: inset 0 0 0 2px var(--key), 0 0 18px var(--screen-ink); }
  .screen h2 { font-size: 10px; margin: 0; font-weight: 400; color: var(--lamp); letter-spacing: 1px; line-height: 1.6; }
  .screen p { font-size: 8px; line-height: 2; margin: 0; }
  .step { position: absolute; top: 6px; right: 8px; font-size: 6px; opacity: .7; }
  .pin { display: flex; gap: 8px; }
  .pin span { width: 18px; height: 22px; border-bottom: 3px solid var(--screen-ink); font-size: 12px; line-height: 22px; }
  .keys { display: grid; grid-template-columns: repeat(3, 44px); gap: 6px; }
  .keys button { background: var(--key); color: var(--screen-ink); border: 2px solid var(--ink); box-shadow: none; padding: 8px 0; font-size: 10px; }
  .keys button:active { transform: none; box-shadow: none; background: var(--panel2); }
  .startbtn {
    width: 96px; height: 96px; border-radius: 50%; padding: 0; display: grid; place-items: center; touch-action: none;
    border: 4px solid var(--ink); box-shadow: 0 0 0 3px var(--ring);
    background: conic-gradient(var(--rose) calc(var(--p, 0) * 1turn), var(--panel2) 0);
  }
  .startbtn:active { transform: none; box-shadow: 0 0 0 3px var(--ring); }
  .startbtn span { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--cream); font-size: 8px; line-height: 1.8; }
  .wheel { width: min(56vw, 340px); height: auto; margin-top: auto; margin-bottom: calc(min(56vw, 340px) * -0.5); flex: none; }
  .glove {
    position: absolute; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); width: 88px; height: 50px; padding: 0;
    background: var(--panel2); color: var(--cream); font-size: 6px; border: 3px solid var(--ink); box-shadow: none;
  }
  .glove::after { content: ""; position: absolute; left: 50%; top: 8px; width: 22px; height: 3px; margin-left: -11px; background: var(--ink); }
  .glove:active { transform: none; box-shadow: none; }
  .glove.pulse { animation: pulse 1s steps(2) infinite; }
  .glove.open { background: var(--ink); }
  @keyframes pulse { 50% { border-color: var(--lamp); color: var(--lamp); } }
  @media (max-width: 520px) { .wheel { width: 52vw; margin-bottom: -26vw; } .glove { width: 76px; } .cluster { gap: 6px; } .keys { grid-template-columns: repeat(3, 40px); } }

  /* licence */
  .licence {
    position: fixed; left: 50%; top: 42%; z-index: 7; width: min(470px, 94vw); cursor: pointer;
    background: var(--card); color: var(--ink); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
    transform: translate(-50%, 60vh) scale(.4); opacity: 0;
    transition: transform .7s cubic-bezier(.2, .8, .2, 1), opacity .5s;
  }
  .licence.show { transform: translate(-50%, -50%) rotate(-2deg); opacity: 1; }
  .licence.scanned { transform: translate(-50%, -90%) scale(.3); opacity: 0; }
  .licence:focus-visible { outline: 3px solid var(--lamp); outline-offset: 4px; }
  .lc-head { background: var(--rose); font-size: 9px; padding: 9px 10px; border-bottom: 3px solid var(--ink); letter-spacing: 1px; }
  .lc-body { display: flex; gap: 12px; padding: 12px 10px; }
  .lc-photo { width: 96px; height: 120px; flex: none; background: var(--glass); border: 2px solid var(--ink); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  @media (max-width: 520px) { .lc-photo { width: 70px; height: 90px; } .lc-fields { font-size: 9px !important; } .lc-fields small { font-size: 7px !important; } .lc-fields b { font-size: 7px; } }
  .lc-photo svg, .lc-photo img { width: 100%; display: block; }
  .lc-photo img { height: 100%; object-fit: cover; }
  .lc-fields { display: grid; gap: 9px; font-size: 10px; line-height: 1.6; min-width: 0; flex: 1; }
  .lc-fields small { font-size: 8px; color: var(--ink); }
  .lc-issued { padding: 0 10px 8px; font-size: 6px; line-height: 1.8; color: var(--muted); }
  .lc-fields b { display: block; font-weight: 400; font-size: 8px; color: var(--lc-label); margin-bottom: 2px; }
  :root { --lc-label: #4E2D7A; }
  .lc-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 10px 10px; font-size: 6px; }
  .barcode { height: 16px; flex: 1; max-width: 120px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px); }
  @media (prefers-reduced-motion: reduce) { .charm, .glove.pulse { animation: none; } .licence, .dash { transition: none; } }



  @media (min-width: 700px) {
    .ui { padding-top: calc(env(safe-area-inset-top, 0px) + 4vh); }
    h1 { max-width: 30ch; font-size: clamp(16px, 1.7vw, 22px); }
    .sub { max-width: none; }
  }
  /* driving pedals */
  .pedals {
    position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 4;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  .pedal-row { display: flex; gap: 10px; align-items: flex-end; }
  .pedal {
    padding: 0 0 6px; display: flex; align-items: flex-end; justify-content: center; touch-action: none;
    color: var(--cream); font-size: 7px; border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
    background-color: var(--pedal);
    background-image: repeating-linear-gradient(0deg, var(--pedal-groove) 0 2px, transparent 2px 7px);
  }
  .pedal.on, .pedal:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  #brakeBtn { width: 64px; height: 54px; }
  #gasBtn { width: 42px; height: 74px; background-color: var(--pedal2); }
  #revBtn { width: 46px; height: 34px; padding: 0; font-size: 11px; background: var(--cream); box-shadow: 3px 3px 0 var(--ink); }
  #revBtn[aria-pressed="true"] { background: var(--cream); color: var(--rose); outline: 3px solid var(--rose); outline-offset: -6px; }
  :root { --pedal: #4A3F68; --pedal2: #5A4E7A; --pedal-groove: #2E2448; }

  /* right-hand-drive dashboard layout: glovebox left, screen centre, wheel + cluster right */
  .dgrid { display: grid; grid-template-rows: 100%; min-height: 0; grid-template-columns: 0.8fr minmax(196px, 1.6fr) 1.2fr; gap: 10px; width: 100%; max-width: none; height: 100%; }
  .dleft, .dcenter, .dright { display: flex; flex-direction: column; align-items: center; min-width: 0; min-height: 0; height: 100%; }
  .dref { flex: none; }
  .dcenter .screen { width: 100%; max-width: 340px; }
  .panel { overflow: clip; }
  .cluster2 .g p { white-space: nowrap; overflow: hidden; text-overflow: clip; }
  #ventL { width: 46%; max-width: 120px; height: 30px; margin-top: 12px; align-self: flex-start; }
  #ventC { width: 80%; height: 28px; margin-bottom: 10px; }
  #climate { width: 100%; height: 30px; margin-top: 16px; }
  #gear { width: 100%; flex: 1 1 auto; min-height: 30px; }
  .cluster2 { display: flex; gap: 6px; width: 100%; justify-content: center; padding-top: 2px; }
  .cluster2 .g { width: 46%; max-width: 130px; }
  .dright .wheel { width: 140%; max-width: 420px; margin: 18px -34% 0 0; align-self: flex-end; height: auto; }
  .panel { padding-left: calc(4.5vw + 8px); padding-right: calc(4.5vw + 8px); }
  .dleft .glove {
    position: relative; right: auto; bottom: auto; width: 100%; max-width: none; height: 46%; max-height: 240px;
    margin-top: auto; margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
  }
  @media (max-width: 560px) {
    .panel { padding-left: 14px; padding-right: 14px; }
    .dgrid { grid-template-columns: 0.6fr minmax(196px, 1.6fr) 1fr; gap: 8px; }
    .cluster2 { flex-direction: column; align-items: center; gap: 2px; }
    .cluster2 .g { width: 84%; max-width: none; }
    .dright .wheel { width: 190%; margin: 10px -95% 0 0; }
    .dleft .glove { height: 34%; }
    #ventL { width: 84%; align-self: center; }
  }

  /* the real gift */
  .polaroid {
    position: fixed; left: 50%; top: 47%; z-index: 7; width: min(330px, 86vw);
    transform: translate(-50%, 70vh) rotate(5deg); opacity: 0;
    transition: transform .8s cubic-bezier(.2, .8, .2, 1), opacity .5s;
  }
  .polaroid.show { transform: translate(-50%, -50%) rotate(-2deg); opacity: 1; }
  .pol-front {
    position: relative; box-sizing: border-box; padding: 12px 12px 14px; text-align: center; color: var(--ink);
    background: var(--card); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
  }
  .pol-back {
    position: absolute; inset: 0; background: var(--card); border: 3px solid var(--ink);
    transform: rotate(8deg) translate(12px, 8px); transition: opacity .35s;
  }
  .polaroid.last .pol-back { opacity: 0; }
  .pol-photo img, .pol-photo span { transition: transform .28s, opacity .28s; }
  .pol-photo.flip img, .pol-photo.flip span { transform: translateX(-120%) rotate(-10deg); opacity: 0; }
  .pol-photo {
    width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: var(--glass); border: 2px solid var(--ink); font-size: 8px; line-height: 1.8; padding: 0; cursor: pointer;
    box-shadow: none; color: var(--ink);
  }
  .pol-photo:active { transform: none; box-shadow: none; }
  .pol-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pol-count { font-size: 6px; margin: 6px 0 0; opacity: .7; }
  .pol-l1 { font-size: clamp(8px, 2.4vw, 10px); line-height: 1.9; margin: 12px 0 8px; }
  .pol-l2 { font-size: clamp(11px, 3.2vw, 14px); line-height: 1.7; margin: 0 0 14px; color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .polaroid { transition: none; } }

  /* gift screen + full-size photo */
  .giftscreen {
    position: fixed; inset: 0; z-index: 7; display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 14px calc(env(safe-area-inset-bottom, 0px) + 16px);
    background: rgba(14, 10, 24, .74); opacity: 0; transition: opacity .35s;
  }
  .giftscreen.show { opacity: 1; }
  .gs-card {
    position: relative; width: min(580px, 100%); box-sizing: border-box; padding: 22px 16px 22px; text-align: center;
    background: var(--panel); color: var(--cream); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
    transform: scale(.92); transition: transform .35s cubic-bezier(.2, .8, .2, 1);
  }
  .giftscreen.show .gs-card { transform: scale(1); }
  .gs-x {
    position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; padding: 0; font-size: 12px;
    background: var(--cream); color: var(--ink); box-shadow: 3px 3px 0 var(--ink);
  }
  .gs-x:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .gs-title { font-size: clamp(10px, 2.6vw, 14px); line-height: 1.8; color: var(--lamp); margin: 6px 44px 20px; }
  .gs-pols { display: flex; gap: 16px; justify-content: center; }
  .gs-pol {
    flex: 1 1 0; max-width: 240px; display: block; padding: 8px 8px 10px; cursor: pointer; text-align: center;
    background: var(--card); color: var(--ink); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    transform: rotate(-3deg);
  }
  .gs-pol:nth-child(2) { transform: rotate(3deg); }
  .gs-pol:active { box-shadow: 0 0 0 var(--ink); }
  .gs-pol .ph {
    display: flex; align-items: center; justify-content: center; aspect-ratio: 1; overflow: hidden;
    background: var(--glass); border: 2px solid var(--ink); font-size: 7px;
  }
  .gs-pol .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gs-pol .tap { display: block; margin-top: 8px; font-size: 6px; color: var(--muted); }
  .gs-line { font-size: clamp(9px, 2.4vw, 12px); line-height: 2; margin: 22px 0 0; }
  .lightbox {
    position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 62px) 14px calc(env(safe-area-inset-bottom, 0px) + 20px);
    background: rgba(6, 4, 14, .94);
  }
  .lightbox img { max-width: 100%; max-height: 100%; border: 3px solid var(--cream); box-shadow: 6px 6px 0 var(--ink); }
  .lightbox .gs-x { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px; }
  .lb-msg { color: var(--cream); font-size: 10px; }
  @media (prefers-reduced-motion: reduce) { .giftscreen, .gs-card { transition: none; } }
  /* finale */
  .pad {
    position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 4;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  .pad .dirs { display: flex; gap: 10px; }
  .pad button { width: 58px; height: 52px; padding: 0; font-size: 14px; background: var(--cream); touch-action: none; }
  .pad #padAct { width: auto; padding: 0 18px; font-size: 11px; background: var(--rose); }
  .finmsg {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16%); transform: translateX(-50%); z-index: 4;
    width: min(90vw, 520px); margin: 0; text-align: center; color: var(--cream);
    font-size: clamp(11px, 2vw, 17px); line-height: 2; text-shadow: 3px 3px 0 var(--ink);
    opacity: 0; transition: opacity .6s; pointer-events: none;
  }
  .finmsg.show { opacity: 1; }
  .finmsg .up {
    display: block; width: 0; height: 0; margin: 0 auto 14px;
    border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 16px solid var(--lamp);
    animation: bob .9s steps(2) infinite;
  }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .end { left: auto; right: 0; align-items: flex-end; top: calc(env(safe-area-inset-top, 0px) + 62px); bottom: auto; max-width: 60vw; }
  .end p:not([hidden]) { background: rgba(14, 10, 24, .78); padding: 6px 12px; }
  .end .signoff { color: var(--cream); font-size: clamp(7px, 1vw, 10px); }
  .end .signoff:empty { display: none; }
  @media (prefers-reduced-motion: reduce) { .finmsg .up { animation: none; } .finmsg { transition: none; } }
  /* pixel-art dashboard: the art is drawn on a canvas, DOM keeps the controls */
  .dash-art { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .windshield { border: 0; padding-top: env(safe-area-inset-top, 0px); z-index: 1; }
  .windshield::before, .mirror, .charm { display: none; }
  .panel { background: transparent; border-top: 0; box-shadow: none; z-index: 1; }
  .gface { width: 100%; aspect-ratio: 1; }
  .g p { color: var(--muted); }
  .screen {
    border: 0; box-shadow: none; background-color: var(--screen);
    background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, .04) 0 1px, transparent 1px 3px);
  }
  .dash.on .screen { box-shadow: 0 0 18px rgba(185, 241, 140, .3); }
  .wheel { aspect-ratio: 1; }
  .glove { background: transparent; border: 0; color: var(--muted); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; }
  .glove.open { background: transparent; }
  .glove.pulse { animation: none; color: var(--lamp); }
  .note { z-index: 2; }
  .note::before { content: ""; position: absolute; top: -7px; left: 34%; width: 34px; height: 11px; background: var(--cream); opacity: .6; }
</style>
</head>
<body>
<canvas id="scene" aria-label="A little pixel car driving down a street, passing billboards with messages"></canvas>

<div class="bar">
  <div class="menu-wrap">
    <button id="musicBtn" type="button" aria-haspopup="true" aria-expanded="false">Music</button>
    <div class="menu" id="menu" hidden></div>
  </div>
  <button id="skyBtn" type="button" hidden>Day</button>
  <button id="honkBtn" type="button" hidden>Honk</button>
</div>

<p class="toast" id="toast" role="status"></p>
<p class="finmsg" id="finMsg" role="status"></p>
<div class="giftscreen" id="gift" role="dialog" aria-modal="true" aria-labelledby="giftTitle" hidden>
  <div class="gs-card">
    <button class="gs-x" id="giftClose" type="button" aria-label="Close">X</button>
    <p class="gs-title" id="giftTitle"></p>
    <div class="gs-pols" id="giftPols"></div>
    <p class="gs-line" id="giftLine"></p>
  </div>
</div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo" hidden>
  <button class="gs-x" id="lbClose" type="button" aria-label="Close photo">X</button>
  <img id="lbImg" alt="Donation photo">
  <p class="lb-msg" id="lbMsg" hidden>Photo not added yet.</p>
</div>
<div class="pedals" id="pedals" hidden>
  <button id="revBtn" type="button" aria-pressed="false" aria-label="Reverse gear">R</button>
  <div class="pedal-row">
    <button class="pedal" id="brakeBtn" type="button">BRAKE</button>
    <button class="pedal" id="gasBtn" type="button">GAS</button>
  </div>
</div>
<div class="pad" id="pad" hidden>
  <button id="padAct" type="button" hidden>PULL</button>
  <div class="dirs">
    <button id="padL" type="button" aria-label="Walk left">&lt;</button>
    <button id="padR" type="button" aria-label="Walk right">&gt;</button>
  </div>
</div>

<div class="ui">
  <div id="intro">
    <p class="greet" id="greet"></p>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
    <button id="start" type="button">Head home</button>
  </div>
  <p class="hint" id="hint">Use the pedals to drive. Tap the car to honk.</p>
  <div class="end" id="end" hidden>
    <p class="signoff" id="signoffLine"></p>
    <p id="endHint" hidden>You drove past something secret. Look for the ? sign and try again.</p>
    <button id="again" type="button">Drive again</button>
  </div>
</div>

<div class="modal" id="gate" hidden role="dialog" aria-labelledby="gateTitle">
  <p class="lk-title" id="gateTitle"><span class="lk-led" id="gateLed"></span>GARAGE LOCK</p>
  <p class="lk-q" id="gateQ"></p>
  <p class="lk-hint" id="gateHint"></p>
  <input id="gateInput" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" aria-labelledby="gateQ">
  <p class="lk-msg" id="gateMsg" role="status"></p>
  <button id="gateBtn" type="button">Unlock</button>
</div>

<div class="dash" id="dash" hidden>
  <canvas class="dash-art" id="dashArt" aria-hidden="true"></canvas>
  <div class="windshield"></div>
  <div class="panel">
    <div class="dgrid">
      <div class="dleft">
        <div class="dref" id="ventL"></div>
        <button class="glove" id="glove" type="button">GLOVEBOX</button>
      </div>
      <div class="dcenter">
        <div class="dref" id="ventC"></div>
        <div class="screen" id="screen" aria-live="polite"></div>
        <div class="dref" id="climate"></div>
        <div class="dref" id="gear"></div>
      </div>
      <div class="dright">
        <div class="cluster2" id="clusterBox">
          <div class="g"><div class="gface" id="revG" aria-hidden="true"></div><p>RPM</p></div>
          <div class="g"><div class="gface" id="fuelG" aria-hidden="true"></div><p id="fuelTxt"></p></div>
        </div>
        <div class="wheel" id="wheelBox" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</div>

<div class="licence" id="licence" role="button" tabindex="0" aria-label="Your driving licence. Tap to scan." hidden>
  <div class="lc-head">DRIVING LICENCE</div>
  <div class="lc-body">
    <div class="lc-photo" id="lcPhoto"></div>
    <div class="lc-fields" id="lcFields"></div>
  </div>
  <div class="lc-issued" id="lcIssued"></div>
  <div class="lc-foot"><span class="barcode"></span><span>Read it carefully. Then tap to scan.</span></div>
</div>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function R(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
const font = s => `${s}px "Press Start 2P", ui-monospace, "Courier New", monospace`;
function star(x, y, s, c){ R(x, y - s, 1, 2 * s + 1, c); R(x - s, y, 2 * s + 1, 1, c); }

function wrap(text, maxW){
  const words = text.split(/\s+/); const lines = []; let cur = '';
  for (const w of words){
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width <= maxW) cur = t; else { if (cur) lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}
function fit(text, maxW, maxH, sizes){
  let res;
  for (const s of sizes){
    ctx.font = font(s);
    const lines = wrap(text, maxW), lh = s * 1.6;
    res = { s, lines, lh };
    if (lines.length * lh <= maxH && lines.every(l => ctx.measureText(l).width <= maxW)) return res;
  }
  return res;
}
function centerText(f, cx, top, h, color){
  ctx.font = font(f.s); ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const y0 = top + (h - f.lines.length * f.lh) / 2 + f.s * 0.3;
  f.lines.forEach((l, i) => ctx.fillText(l, cx, y0 + i * f.lh));
}

// Sleek low sedan, 60px wide, built row by row (faces right).
function buildCar(){
  const CW = 60, rows = [];
  for (let r = 0; r < 13; r++) rows.push(Array(CW).fill('.'));
  const set = (x, y, c) => { if (x >= 0 && x < CW && y >= 0 && y < 13) rows[y][x] = c; };
  // cabin: fastback roof sloping both ways
  for (let r = 0; r <= 5; r++){
    const L = 20 - 2 * r, Rr = 36 + 2 * r;
    for (let x = L; x <= Rr; x++){
      let c;
      if (r === 0 || x <= L + 1 || x >= Rr - 1) c = 'D';
      else if (r === 1) c = 'h';
      else if (r === 5) c = 'C';
      else if (x === 30) c = 'D';
      else if (x === 31) c = 'w';
      else c = 'W';
      set(x, r, c);
    }
  }
  [[23,2],[24,2],[22,3],[35,2],[36,2],[34,3]].forEach(([x, y]) => set(x, y, 'S'));
  // body
  for (let r = 6; r <= 12; r++){
    const L = r === 6 ? 3 : r === 7 ? 2 : r <= 11 ? 1 : 2;
    const Rr = r === 6 ? 56 : r === 7 ? 57 : r <= 11 ? 58 : 57;
    for (let x = L; x <= Rr; x++){
      let c;
      if (x === L || x === Rr) c = 'D';
      else if (r === 6) c = (x <= 9 || x >= 47) ? 'D' : 'h';
      else if (r === 7) c = 'h';
      else if (r === 11) c = 'b';
      else if (r === 12) c = 'D';
      else c = 'B';
      set(x, r, c);
    }
  }
  for (let x = 2; x <= 4; x++) set(x, 8, 'T');        // tail light
  set(2, 9, 'T');
  for (let x = 51; x <= 57; x++) set(x, 8, 'L');      // LED headlight strip
  set(57, 9, 'L');
  for (let r = 9; r <= 11; r++) set(57, r, 'M');      // grille
  for (let r = 7; r <= 11; r++){ set(18, r, 'd'); set(31, r, 'd'); set(45, r, 'd'); }   // door lines
  set(41, 8, 'C'); set(42, 8, 'C');                   // door handle
  for (let x = 16; x <= 42; x++) set(x, 10, 'c');     // body crease
  return rows.map(a => a.join(''));
}

// the girl (her), facing right: 10x18 with an outline, long hair, 4-frame walk with arm swing and a body bob
function buildGirl(){
  const TOP = [
    "...kkkk...",
    "..kHHhhk..",
    ".kHhhhhhk.",
    "khhhhsssk.",
    "khhhsesek.",
    "khhhsssbk.",
    "khhgssmk..",
    "khhhksk...",
    ".khhtcctk.",
    ".khhttttk.",
    "..kttttk..",
    "..kTTTTk.."
  ];
  const mk = (dy, fl, bl, fa, ba, liftBack) => {
    const g = Array.from({ length: 18 }, () => Array(10).fill('.'));
    const put = (x, y, c) => { if (x >= 0 && x < 10 && y >= 0 && y < 18) g[y][x] = c; };
    for (let r = 0; r < 4; r++) put(2 + Math.round(ba * r / 3), 8 + dy + r, 'S');            // far arm, behind the body
    TOP.forEach((row, r) => [...row].forEach((ch, c) => { if (ch !== '.') put(c, r + dy, ch); }));
    const hip = 12 + dy;
    const leg = (o, col, shoe, lift) => {
      const end = 16 - (lift ? 1 : 0);
      for (let r = hip; r <= end; r++){
        const t = (r - hip) / Math.max(1, end - hip), x = 4 + Math.round(o * t);
        put(x, r, col); put(x + 1, r, col);
      }
      const sx = 4 + o; put(sx, end + 1, shoe); put(sx + 1, end + 1, shoe); put(sx + 2, end + 1, shoe);
    };
    leg(bl, 'J', 'W', liftBack);                                                            // far leg
    leg(fl, 'j', 'w', false);                                                               // near leg
    for (let r = 0; r < 4; r++){ const x = 7 + Math.round(fa * r / 3); put(x, 8 + dy + r, 's'); put(x + 1, 8 + dy + r, r === 3 ? 'S' : 'k'); }   // near arm at her side
    return g.map(r => r.join(''));
  };
  return {
    idle: mk(1, 1, -1, 0, 0, false),
    walk: [mk(1, 2, -2, -1, 1, false), mk(0, 0, 0, 0, 0, true), mk(1, -2, 2, 1, -1, false), mk(0, 0, 0, 0, 0, true)]
  };
}

function audio(){

}

function tone(dest, f, t, d, type, vol){

  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.04, d));
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + 0.03);

function stopMusic(){
  if (!seq) return;
  if (seq.timer) clearInterval(seq.timer);
  if (seq.el) seq.el.pause();
  seq = null;
}
function schedule(){
  if (!seq || !seq.voices) return;
  const ahead = AC.currentTime + 0.25;
  for (const vs of seq.voices){
    while (vs.t < ahead){
      const [m, b] = vs.v.notes[vs.i];
      const d = b * seq.spb;
      if (m != null) tone(musicGain, mf(m), vs.t, d * 0.9, vs.v.type, vs.v.vol);
      vs.t += d; vs.i = (vs.i + 1) % vs.v.notes.length;
    }
  }
}

  seq = { spb: 60 / tr.bpm, voices: tr.voices.map(v => ({ v, i: 0, t: ac.currentTime + 0.08 })) };

function makeLayer(seed, h, hmin, hmax, col, win, rate){
  const rnd = mulberry32(seed);
  const c = document.createElement('canvas'); c.width = TILE; c.height = h;
  const g = c.getContext('2d');
  let x = 0;
  while (x < TILE){
    const bw = Math.min(10 + Math.floor(rnd() * 16), TILE - x);
    const bh = hmin + Math.floor(rnd() * (hmax - hmin));
    g.fillStyle = col; g.fillRect(x, h - bh, bw, bh);
    if (rnd() < 0.2) g.fillRect(x + Math.floor(bw / 2), h - bh - 5, 1, 5);
    g.fillStyle = win;
    for (let wy = h - bh + 3; wy < h - 3; wy += 4)
      for (let wx = x + 2; wx < x + bw - 2; wx += 3)
        if (rnd() < rate) g.fillRect(wx, wy, 1, 2);
    x += bw + Math.floor(rnd() * 3);
  }
  return c;
}

        const maxH = groundY - POST - 14;                                    // keep the board under the sky line
        if (b.square){                                                       // square board, photo cropped to fill it
          const cap = capFor(76), ph = Math.max(48, Math.min(76, maxH - 6 - cap));
          w = Math.round(ph) + 6; h = Math.round(ph) + 6 + cap;
          Object.assign(b, { x: bxCursor, w, h }); bxCursor += w + 46; return b;
        }
        let ph = ar < 1 ? 82 : 64, cap = capFor(Math.max(70, Math.round(ph * ar) + 6));   // tall photos get a taller board
        ph = Math.min(ph, maxH - 6 - cap);

        if (w > W - 20){ w = W - 20; ph = (w - 6) / ar; }                    // very wide photos: shrink to fit the screen
        if (b.caption) w = Math.max(w, 70);                                  // room for the caption
        w = Math.max(w, 44);

      }
    }

// ---------- update ----------
const CONF = ['#FF6F91', '#FFE27A', '#9FE3FF', '#FFF4D6', '#B9F18C'];
function burst(n){
  const cx = finalBoard.x - cam + finalBoard.w / 2, cy = groundY - POST - finalBoard.h;
  for (let i = 0; i < n; i++){
    confetti.push({ x: cx + (Math.random() - 0.5) * finalBoard.w, y: cy + Math.random() * 10,
      vx: (Math.random() - 0.5) * 70, vy: -40 - Math.random() * 60, c: CONF[i % CONF.length], life: 2.5 + Math.random() * 2 });
  }
}

function update(dt){
  updateIntro(dt);
  // stage 0: driving to the birthday board, 1: parked there with confetti,
  // 2: rolling on to the sign-off board, 3: finished
  if (started && stage === 0){
    const limit = camEnd, rev = reverseGear || reverseHeld;
    let target = rev ? -(gasOn || boost ? 45 : 22) : (gasOn || boost ? BOOST : BASE);
    if (brakeOn) target = 0;
    v += (target - v) * Math.min(1, dt * (brakeOn ? 4 : 2.5));
    if (v > 0) v = Math.min(v, (limit - cam) * 1.2 + 3);
    cam += v * dt;
    if (cam < 0){ cam = 0; if (v < 0) v = 0; }
    if (rev && v < -1){ beepT -= dt; if (beepT <= 0){ beepT = 0.7; const ac = audio(); if (ac) tone(sfxGain, 1050, ac.currentTime, 0.14, 'square', 0.12); } } else beepT = 0;
    if (v >= 0 && limit - cam < 0.3){
      cam = limit; v = 0;
      stage = 1; ended = true;
      $('pedals').hidden = true;
      $('hint').classList.remove('show');
      startFinale();
    }
  }
  updateFinale(dt);
  // footsteps: a soft step each time a foot lands in her walk cycle
  const walkingNow = phase === 1 || (phase === 5 && girlX > carX + 30) || (fin === 2 && walkDir !== 0);
  if (walkingNow){
    const f = Math.floor(girlStep * 6) % 4;
    if (f !== lastStepF){ lastStepF = f; if (f === 0 || f === 2) footstep(); }
  } else lastStepF = -1;
  bubbleT = Math.max(0, bubbleT - dt);
  puffT += dt;
  if (engineOn && puffT > (v > 1 ? 0.14 : 0.4)){
    puffT = 0;
    puffs.push({ x: cam + carX - 1, y: carY + 10 + Math.random() * 2, life: 0.8, max: 0.8 });
  }
  puffs.forEach(p => { p.life -= dt; p.y -= 6 * dt; p.x -= 8 * dt; });
  puffs = puffs.filter(p => p.life > 0);
  sparks.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 30 * dt; s.life -= dt; });
  sparks = sparks.filter(s => s.life > 0);
  confetti.forEach(c => { c.vy += 70 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= 0.99; c.life -= dt; });
  confetti = confetti.filter(c => c.life > 0 && c.y < H + 4);
}

  const sx = qx - cam;

function updateFinale(dt){
  for (const f of fireworks){
    if (!f.parts){
      f.trail.push({ x: f.x, y: f.y }); if (f.trail.length > 6) f.trail.shift();
      f.y += f.vy * dt;
      if (f.y <= f.ty){
        const n = RM ? 14 : 40;
        f.parts = Array.from({ length: n }, (_, i) => {
          const a = i / n * Math.PI * 2 + Math.random() * 0.1, sp = 26 + Math.random() * 26;
          return { x: f.x, y: f.ty, px: f.x, py: f.ty, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.6 + Math.random() * 0.4 };
        });
        sfx.boom(Math.max(-1, Math.min(1, f.x / W * 2 - 1)));
      }
    } else for (const q of f.parts){ q.px = q.x; q.py = q.y; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 14 * dt; q.vx *= 0.985; q.vy *= 0.985; q.life -= dt; }
  }
  fireworks = fireworks.filter(f => !f.parts || f.parts.some(q => q.life > 0));
  for (const q of roadConf){
    if (q.settled) continue;
    q.y += q.vy * dt; q.x += Math.sin(q.y * 0.15 + q.ph) * 12 * dt;
    if (q.y >= q.stop){ q.y = q.stop; q.settled = true; }
  }
  for (const q of msgConf) q.t += dt;
  updateGiftBox(dt);
  if (plane){
    plane.t += dt;
    const total = (22 + bannerCv.width) * planeK();
    const target = plane.x + total / 2 > W * 0.5 ? 46 : 10;
    plane.v += (target - plane.v) * Math.min(1, dt * 0.8);
    plane.x -= plane.v * dt;
    if (plane.x + total < -8){ plane.x = W + 8; plane.v = 46; }
    if (drone){
      const cx = plane.x + total / 2, vis = cx > -30 && cx < W + 30;
      if (drone.pn) drone.pn.pan.setTargetAtTime(Math.max(-1, Math.min(1, cx / W * 2 - 1)), AC.currentTime, 0.1);
      drone.g.gain.setTargetAtTime(vis ? 0.06 : 0.01, AC.currentTime, 0.3);
    }
  }
  if (stencilN >= 0 && !stencilDone){
    const total = stencilLines().join('').length;
    stencilN = Math.min(total, stencilN + dt * 14);
    if (stencilN >= total){
      stencilDone = true;
      later(() => { $('endHint').hidden = true; $('end').hidden = false; document.querySelector('.bar').hidden = false; }, 700);
    }
  }
  if (!fin) return;
  finT += dt;
  if (fin === 1){
    if (finT > 0.6){ fin = 2; finT = 0; idleT = 0; $('pad').hidden = false; showToast('Walk with the arrows. Something is waiting.'); }
  } else if (fin === 2){
    if (walkDir){ finGX += walkDir * 26 * dt; finFace = walkDir; girlStep += dt; idleT = 0; } else idleT += dt;
    finGX = Math.max(cam + carX + 22, Math.min(cam + W - 12, finGX));
    const near = Math.abs((finGX + 4) - (leverX + 6)) < 16;
    $('padAct').hidden = !near;
    if (idleT > 7 && !near){ idleT = 0; showToast('Psst. The lever.'); }
    leverPull = pulling && near ? Math.min(1, leverPull + dt / 0.8) : Math.max(0, leverPull - dt * 2);
    const b = Math.floor(leverPull * 6);
    if (b > ratchetB) sfx.ratchet();
    ratchetB = b;
    if (leverPull >= 1) blackout();
  } else if (fin === 5){
    const A = blockData(), total = A.cells.length, step = 4.8 / total;
    spellT += dt;
    while (spellT >= step && litN < total){ spellT -= step; litN++; if (litN % 4 === 0) sfx.click(litN); }
    if (humG) humG.gain.setTargetAtTime(0.015 + 0.09 * litN / total, AC.currentTime, 0.2);
    if (litN >= total && !fin5Done){ fin5Done = true; later(lightsBack, 1500); }
  } else if (fin >= 6){
    lampsBackT += dt;
    darkA = Math.max(0, darkA - dt * 0.7);
    fwT -= dt;
    if (fwT <= 0){ spawnFirework(); fwT = finT < 9 ? 0.45 + Math.random() * 0.55 : 1.3 + Math.random() * 1.2; }
    if (finT < 6.5 && roadConf.length < (RM ? 120 : 520)){
      for (let i = 0; i < (RM ? 1 : 4); i++){ const cx = Math.random() * W; roadConf.push({
        x: Math.random() * W, y: groundY - 70 - Math.random() * 50, vy: 35 + Math.random() * 35, ph: Math.random() * 6,
        stop: confStop(cx),
        w: Math.random() < 0.5 ? 2 : 1, h: 1, c: CONF[Math.floor(Math.random() * CONF.length)]
      }); roadConf[roadConf.length - 1].x = cx; }
    }
  }
}

function pline(x0, y0, x1, y1, c){
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy; ctx.fillStyle = c;
  for (let n = 0; n < 400; n++){
    ctx.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy){ err += dy; x0 += sx; }
    if (e2 <= dx){ err += dx; y0 += sy; }
  }
}
function ringRows(cx, cy, ro, ri, col){
  for (let y = -ro; y <= ro; y++){
    const c = typeof col === 'function' ? col(y) : col;
    if (!c) continue;
    const wo = Math.floor(Math.sqrt(Math.max(0, ro * ro - y * y + ro * 0.6)));
    if (Math.abs(y) <= ri){
      const wi = Math.floor(Math.sqrt(Math.max(0, ri * ri - y * y + ri * 0.6)));
      R(cx - wo, cy + y, wo - wi, 1, c); R(cx + wi + 1, cy + y, wo - wi, 1, c);
    } else R(cx - wo, cy + y, wo * 2 + 1, 1, c);
  }
}
function disc(cx, cy, r, c){ ringRows(cx, cy, r, -1, c); }

function gaugeStatic(g, kind){

    }

  } else {

  R(mx + 1, my, mw - 2, 12, DINK); R(mx, my + 1, mw, 10, DINK);
  R(mx + 1, my + 1, mw - 2, 10, '#3A2E55');
  R(mx + 2, my + 2, mw - 4, 2, '#CFF3FF'); R(mx + 2, my + 4, mw - 4, 4, '#9FE3FF'); R(mx + 2, my + 8, mw - 4, 2, '#78BFE0');
  R(mx + Math.round(mw * 0.3), my + 6, Math.round(mw * 0.4), 3, '#5E8FB0');
  for (let i = 0; i < 5; i++) R(mx + 5 + i, my + 2 + i, 1, 1, '#FFFFFF');

  // dashboard body
  const trimY = G.climate.y + G.climate.h + 6;
  for (let y = pt; y < gh; y++) R(0, y, gw, 1, y < pt + 2 ? '#4A3D68' : y < pt + 5 ? '#3A2E55' : y < trimY ? '#2A2140' : '#221A36');
  R(0, pt - 1, gw, 1, DINK);
  for (let i = 0; i < gw * (gh - pt) / 28; i++) R(rnd() * gw, pt + 6 + rnd() * (gh - pt), 1, 1, '#251D39');
  for (let x = 1; x < gw; x += 4) R(x, pt + 7, 2, 1, '#5E4F80');
  R(0, trimY, gw, 1, '#8073A6'); R(0, trimY + 1, gw, 1, '#5A4E7A'); R(0, trimY + 2, gw, 1, DINK);
  if (engineOn){ ctx.globalAlpha = 0.7; R(0, trimY + 3, gw, 1, '#B39DDB'); ctx.globalAlpha = 1; }

  // door panels on both edges: handle, window switches, speaker grille
  const dw = gw < 260 ? 6 : Math.max(6, Math.round(gw * 0.045));
  for (const [x0, inner] of [[0, dw - 1], [gw - dw, gw - dw]]){
    R(x0, pt, dw, gh - pt, '#1C1530'); R(inner, pt, 1, gh - pt, '#3A2E55');
    R(x0 + 2, pt + 10, dw - 4, 3, DINK); R(x0 + 3, pt + 10, dw - 6, 1, '#C4BCE0'); R(x0 + 3, pt + 11, dw - 6, 1, '#8073A6');
    R(x0 + 2, pt + 18, Math.max(2, Math.floor(dw / 2) - 2), 2, '#3A3352'); R(x0 + Math.ceil(dw / 2), pt + 18, Math.max(2, Math.floor(dw / 2) - 2), 2, '#3A3352');
    const sr = Math.max(3, Math.min(Math.floor(dw / 2) - 1, 9)), scx = x0 + Math.floor(dw / 2), scy = gh - sr - 12;
    disc(scx, scy, sr, DINK); disc(scx, scy, sr - 1, '#120D1C');
    for (let yy = -sr + 2; yy < sr - 1; yy += 2) for (let xx = -sr + 2; xx < sr - 1; xx += 2) if (xx * xx + yy * yy < (sr - 2) * (sr - 2)) R(scx + xx, scy + yy, 1, 1, '#3A3352');
  }

  // brushed trim strips across the passenger side and the driver side
  const S0 = G.screen, C0 = G.cluster, stripY = G.ventL.y + G.ventL.h + 10;
  const strip = (x0, x1, y) => {
    if (x1 - x0 < 6) return;
    R(x0, y, x1 - x0, 1, DINK); R(x0, y + 1, x1 - x0, 1, '#9A86AE'); R(x0, y + 2, x1 - x0, 2, '#6B5A8E'); R(x0, y + 4, x1 - x0, 1, '#4A3D68'); R(x0, y + 5, x1 - x0, 1, DINK);
    if (engineOn){ ctx.globalAlpha = 0.8; R(x0, y + 6, x1 - x0, 1, '#B39DDB'); ctx.globalAlpha = 1; }
  };
  strip(dw + 1, S0.x - 8, stripY);
  strip(C0.x + C0.w + 8, gw - dw - 1, C0.y + C0.h - 8);
  const aw = glyphW('AIRBAG'), ax = Math.round((dw + S0.x - 8) / 2 - aw / 2);
  if (S0.x - 8 - dw > aw + 10) pixelText('AIRBAG', ax, stripY + 10, '#3E3260');

  // phone in a dash mount, filling the passenger side on tall screens
  const phTop = stripY + 9, phBot = G.glove.y - 5;
  if (phBot - phTop >= 26){
    const pw = 11, ph = Math.min(22, phBot - phTop - 4), px = Math.round(G.glove.x + G.glove.w / 2 - pw / 2), py = Math.round((phTop + phBot) / 2 - ph / 2);
    R(px + 3, py - 3, pw - 6, 3, '#3A3352'); R(px + 4, py + ph, pw - 8, 4, '#3A3352');                       // mount arms
    R(px - 1, py - 1, pw + 2, ph + 2, DINK); R(px, py, pw, ph, '#2A2238');
    R(px + 1, py + 2, pw - 2, ph - 4, engineOn ? '#1E3440' : '#120D1C');
    if (engineOn){ R(px + 4, py + 5, 1, 1, C.rose); R(px + 6, py + 5, 1, 1, C.rose); R(px + 4, py + 6, 3, 1, C.rose); R(px + 5, py + 7, 1, 1, C.rose);
      for (let k = 0; k < 3; k++) R(px + 2, py + 10 + k * 3, pw - 4 - k * 2, 1, '#4E7A6A'); }
    R(px + Math.floor(pw / 2) - 1, py + ph - 1, 3, 1, '#4A3F68');
  }

  // passenger vent by the door, with a little air freshener clipped on
  drawVent(G.ventL);
  const fx = G.ventL.x + G.ventL.w - 6, fy = G.ventL.y + G.ventL.h;
  R(fx, fy, 1, 3, '#C4BCE0');
  R(fx - 1, fy + 3, 3, 2, '#5FCB8A'); R(fx - 2, fy + 5, 5, 2, '#4DB57A'); R(fx - 3, fy + 7, 7, 2, '#3FA06B'); R(fx, fy + 9, 1, 2, '#7A4E2D');

  // centre stack: twin vents with hazard button between, screen, climate, gear console
  const V = G.ventC, half = Math.floor((V.w - 12) / 2);
  drawVent({ x: V.x, y: V.y, w: half, h: V.h });
  drawVent({ x: V.x + V.w - half, y: V.y, w: half, h: V.h });
  const hx = V.x + Math.round(V.w / 2) - 4, hy = V.y + Math.round(V.h / 2) - 4;
  R(hx, hy, 9, 8, DINK); R(hx + 1, hy + 1, 7, 6, '#3A3352');
  R(hx + 4, hy + 2, 1, 1, '#FF3B5C'); R(hx + 3, hy + 3, 3, 1, '#FF3B5C'); R(hx + 2, hy + 4, 5, 1, '#FF3B5C');
  const S = G.screen;
  R(S.x - 4, S.y - 4, S.w + 8, S.h + 13, DINK);
  R(S.x - 3, S.y - 3, S.w + 6, S.h + 11, '#1B1528');
  R(S.x - 3, S.y - 3, S.w + 6, 1, '#4A3F68');
  const by = S.y + S.h + 2, avail = S.w - 16, nb = 4, slot = avail / nb, bw2 = Math.min(8, Math.floor(slot) - 2);
  for (let i = 0; i < nb; i++){
    const bx = Math.round(S.x + 2 + i * slot);
    R(bx, by, bw2, 4, DINK); R(bx + 1, by, bw2 - 2, 3, '#3A3352'); R(bx + 1, by, bw2 - 2, 1, '#5A4E7A');
  }
  const kx2 = S.x + S.w - 5;
  disc(kx2, by + 2, 3, DINK); disc(kx2, by + 2, 2, '#5A4E7A'); R(kx2, by, 1, 2, '#C4BCE0');
  drawClimate(G.climate);
  drawGear(G.gear);

  // driver side: instrument hood with both gauges and an odometer strip
  const C2 = G.cluster, odoH = 9, hoodT = C2.y - odoH - 8, hoodB = C2.y + C2.h + 4;
  for (let y = hoodT; y < hoodB; y++){
    const k = y - hoodT, inset = k < 3 ? 3 - k : 0;
    R(C2.x - 5 + inset, y, C2.w + 10 - inset * 2, 1, k === 0 ? DINK : k < 3 ? '#4A3D68' : '#1C1530');
  }
  gaugeStatic(G.rev, 'rev');
  gaugeStatic(G.fuel, 'fuel');
  const odo = glyphW('1511 KM') <= C2.w - 8 ? '1511 KM' : '1511';
  const ow = glyphW(odo) + 6, ox = C2.x + Math.round(C2.w / 2 - ow / 2), oy = C2.y - odoH - 1;   // odometer sits above the gauges, clear of the wheel
  R(ox - 1, oy - 1, ow + 2, odoH, DINK); R(ox, oy, ow, odoH - 2, '#0E1B22');
  pixelText(odo, ox + 3, oy + 1, engineOn ? '#B9F18C' : '#2E4A3A');

  // driver-side vent beside the instrument hood
  const rvx = C2.x + C2.w + 10, rvw = Math.min(34, gw - dw - 6 - rvx);
  if (rvw >= 12) drawVent({ x: rvx, y: C2.y + 2, w: rvw, h: 12 });

  // engine start/stop button to the left of the wheel
  const wR = Math.floor(G.wheel.w / 2), wcx = G.wheel.x + wR, sbx = wcx - wR - 9, sby = G.wheel.y + Math.round(wR * 0.55);
  if (sbx > S0.x + S0.w + 12 && sby < gh - 8){
    disc(sbx, sby, 5, DINK); disc(sbx, sby, 4, '#8073A6'); disc(sbx, sby, 3, '#2A2238');
    R(sbx, sby - 2, 1, 3, engineOn ? '#B9F18C' : '#FF3B5C'); R(sbx - 1, sby, 1, 1, engineOn ? '#B9F18C' : '#FF3B5C'); R(sbx + 1, sby, 1, 1, engineOn ? '#B9F18C' : '#FF3B5C');
  }

  wheelStatic(G.wheel);

  // glovebox (passenger side)
  const Gl = G.glove;
  R(Gl.x - 1, Gl.y - 1, Gl.w + 2, Gl.h + 2, DINK);
  if (licOut){
    R(Gl.x, Gl.y, Gl.w, Gl.h, '#0E0A16'); R(Gl.x + 4, Gl.y + 4, Gl.w - 8, 3, '#2A2238');
    R(Gl.x, Gl.y + Gl.h - 4, Gl.w, 4, '#332852'); R(Gl.x, Gl.y + Gl.h - 4, Gl.w, 1, '#4A3D68');
  } else {
    R(Gl.x, Gl.y, Gl.w, Gl.h, '#30264B'); R(Gl.x, Gl.y, Gl.w, 1, '#4A3D68'); R(Gl.x, Gl.y + Gl.h - 1, Gl.w, 1, '#1E1630');
    R(Gl.x + 3, Gl.y + 3, Gl.w - 6, 1, '#251D3C'); R(Gl.x + 3, Gl.y + Gl.h - 4, Gl.w - 6, 1, '#3A2E55');      // inset lid
    R(Gl.x + 3, Gl.y + 3, 1, Gl.h - 6, '#251D3C'); R(Gl.x + Gl.w - 4, Gl.y + 3, 1, Gl.h - 6, '#3A2E55');
    const hw = Math.min(22, Gl.w - 10), hx2 = Math.round(Gl.x + Gl.w / 2 - hw / 2);
    R(hx2, Gl.y + 7, hw, 4, DINK); R(hx2 + 1, Gl.y + 7, hw - 2, 1, '#C4BCE0'); R(hx2 + 1, Gl.y + 8, hw - 2, 1, '#8073A6');
    R(hx2 + hw + 3, Gl.y + 7, 1, 3, '#C4BCE0');
  }
  ctx = old;
}

function drawNeedle(g, deg){
  if (!g.r || g.r < 8) return;
  const a = deg * Math.PI / 180, len = g.r - 6;
  const x2 = g.cx + Math.sin(a) * len, y2 = g.cy - Math.cos(a) * len;
  const x0 = g.cx - Math.sin(a) * 3, y0 = g.cy + Math.cos(a) * 3;
  pline(x0, y0, x2, y2, '#FF4D6D');
  if (g.r >= 20) pline(x0 + 1, y0, x2 + 1, y2, '#C8304E');
  disc(g.cx, g.cy, 2, DINK); R(g.cx, g.cy, 1, 1, '#C4BCE0');
}
function drawLights(g, on, cols){
  if (!g.r || g.r < 12) return;
  const y = g.cy + Math.round(g.r * 0.18);
  cols.forEach((c, i) => {
    const x = g.cx - 7 + i * 10;
    R(x, y, 5, 3, DINK);
    R(x + 1, y, 3, 2, on ? c : '#2A2238');
    if (on){ ctx.globalAlpha = 0.35; R(x - 1, y - 1, 7, 5, c); ctx.globalAlpha = 1; }
  });
}
function drawDashDynamic(G, time){
  // a little bobblehead on the passenger side of the dash
  const bx = G.ventL.x + Math.round(G.ventL.w / 2), by = G.panel.y - 1;
  const wob = RM ? 0 : (engineOn ? Math.sin(time * 9) * 1.6 : Math.sin(time * 1.5) * 0.6);
  R(bx - 3, by - 2, 7, 2, DINK);
  R(bx - 2, by - 8, 5, 6, C.rose); R(bx - 2, by - 8, 5, 1, '#FF9AB2');
  R(bx, by - 10, 1, 2, '#8073A6');
  const hx = Math.round(bx - 3 + wob), hy = by - 16;
  R(hx, hy, 7, 6, '#F1C27D'); R(hx, hy, 7, 2, '#3A2418'); R(hx, hy + 2, 1, 3, '#3A2418'); R(hx + 6, hy + 2, 1, 3, '#3A2418');
  R(hx + 2, hy + 3, 1, 1, DINK); R(hx + 4, hy + 3, 1, 1, DINK); R(hx + 3, hy + 5, 1, 1, '#D9708A');
  drawNeedle(G.rev, -120 + 240 * revVal);
  drawNeedle(G.fuel, -110 + 210 * fuelVal);
  const lightsOn = (dashStep >= 2.5 && !engineOn) || engineFlashT > 0;
  drawLights(G.rev, lightsOn, ['#FF3B5C', '#FFB020']);
  drawLights(G.fuel, lightsOn, ['#FF3B5C', '#4FA3FF']);
  if (dashStep === 1 && !licOut && Math.floor(time * 2) % 2 === 0){
    const g = G.glove;
    R(g.x - 2, g.y - 2, g.w + 4, 1, C.lamp); R(g.x - 2, g.y + g.h + 1, g.w + 4, 1, C.lamp);
    R(g.x - 2, g.y - 2, 1, g.h + 4, C.lamp); R(g.x + g.w + 1, g.y - 2, 1, g.h + 4, C.lamp);
  }
}
function drawDash(time, dt){
  const dc = $('dashArt');
  const dpr = window.devicePixelRatio || 1;
  const P = Math.min(5, Math.max(2, Math.round(Math.min(innerWidth, innerHeight) / 190)));
  const Q = Math.max(1, Math.round(P * dpr));
  const cw = Math.round(innerWidth * dpr), ch = Math.round(innerHeight * dpr);
  if (dc.width !== cw || dc.height !== ch){ dc.width = cw; dc.height = ch; }
  const gw = Math.ceil(cw / Q), gh = Math.ceil(ch / Q);
  const pnl = document.querySelector('.panel'); if (pnl.scrollTop || pnl.scrollLeft){ pnl.scrollTop = 0; pnl.scrollLeft = 0; }   // focus must never scroll the dash
  const toG = el => { const r = el.getBoundingClientRect(); return { x: Math.round(r.left * dpr / Q), y: Math.round(r.top * dpr / Q), w: Math.round(r.width * dpr / Q), h: Math.round(r.height * dpr / Q) }; };
  const geo = {
    gw, gh, panel: toG(document.querySelector('.panel')), rev: toG($('revG')), fuel: toG($('fuelG')),
    screen: toG($('screen')), wheel: toG($('wheelBox')), glove: toG($('glove')),
    ventL: toG($('ventL')), ventC: toG($('ventC')), climate: toG($('climate')), gear: toG($('gear')), cluster: toG($('clusterBox')),
    safe: Math.round(parseFloat(getComputedStyle(document.querySelector('.windshield')).paddingTop || 0) * dpr / Q)
  };
  const key = JSON.stringify(geo) + engineOn + licOut;
  if (key !== dashKey){ dashKey = key; dashGeo = geo; buildDashStatic(geo); }
  const target = engineOn && dashStep >= 4 ? revTarget + Math.sin(time * 11) * 0.012 : revTarget;
  revVal += (target - revVal) * Math.min(1, dt * 14);
  fuelVal += ((engineOn ? 1 : 0) - fuelVal) * Math.min(1, dt * 1.6);
  engineFlashT = Math.max(0, engineFlashT - dt);
  const old = ctx; ctx = dctx;
  ctx.setTransform(Q, 0, 0, Q, 0, 0); ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, gw, gh);
  ctx.drawImage(dashStaticCv, 0, 0);
  drawDashDynamic(dashGeo, time);
  ctx = old;
}

// ---------- go ----------
resize();
setMode(mode);
renderMenu();
let last = performance.now();
function frame(t){
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); draw(t / 1000);
  if (dashActive) drawDash(t / 1000, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) document.fonts.load('10px "Press Start 2P"');
</script>
